apiVersion: v1
kind: Namespace
metadata:
  name: web-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-verify
  namespace: web-test
  labels:
    app: kube-verify
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-verify
  template:
    metadata:
      labels:
        app: kube-verify
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80 # must match where the container listen to !
---
# this version "steals" one IP from my pool, for every service
#apiVersion: v1
#kind: Service
#metadata:
#  name: kube-verify
#  namespace: web-test
#spec:
#  selector:
#    app: kube-verify
#  ports:
#    - protocol: TCP
#      port: 80
#      targetPort: 80
#  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: kube-verify
  namespace: web-test
spec:
  selector:
    app: kube-verify
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80 # must match the containerPort
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-test-ingress
  namespace: web-test
spec:
  ingressClassName: traefik
  # tls:
  #   - hosts:
  #     - web-test.${DOMAIN}
  #    secretName: web-test-tls
  rules:
    - host: web-test.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-verify
                port:
                  number: 80