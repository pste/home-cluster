# Alertmanager config lives in a Secret because it contains the ntfy topic URL
# and the healthchecks.io ping URL (both work as credentials: whoever knows
# them can publish/ping). Values come from .env via envsubst.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yml: |
    route:
      receiver: ntfy
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Dead man's switch: ping healthchecks.io every minute while alive
        - matchers:
            - alertname = "Watchdog"
          receiver: healthchecks
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m

    receivers:
      # "template=alertmanager" is a ntfy built-in template that turns the
      # Alertmanager JSON payload into a readable notification.
      - name: ntfy
        webhook_configs:
          - url: "${NTFY_URL}?template=alertmanager"
            send_resolved: true

      - name: healthchecks
        webhook_configs:
          - url: "${HEALTHCHECKS_PING_URL}"
            send_resolved: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          # Pin to a specific version — check latest stable at https://github.com/prometheus/alertmanager/releases
          image: quay.io/prometheus/alertmanager:v0.34.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=https://alertmanager.${DOMAIN}
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
        # Only silences and notification log: fine to lose them on restart.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
