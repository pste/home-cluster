# Prometheus configuration + alerting rules.
#
# IMPORTANT: this file contains literal "$1" and "$labels" / "$value" (relabel
# replacements and Go templates). Always apply it with an explicit variable list
# for envsubst, otherwise they get replaced with empty strings:
#   envsubst '${DOMAIN} ${NTFY_URL} ${HEALTHCHECKS_PING_URL}'
#
# Prometheus does not reload this ConfigMap by itself: after a change run
#   kubectl -n monitoring rollout restart deploy prometheus
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring.svc:9093"]

    rule_files:
      - /etc/prometheus/rules.yml

    # Single-node cluster: in-cluster targets are addressed by their Service
    # DNS name (static_configs), no service discovery needed.
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: alertmanager
        static_configs:
          - targets: ["alertmanager.monitoring.svc:9093"]

      # Pods, deployments, restarts, waiting reasons (CrashLoopBackOff, ...)
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      # Node disk / memory / CPU
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter.monitoring.svc:9100"]

      # Certificate expiry and readiness (certmanager_certificate_*)
      - job_name: cert-manager
        static_configs:
          - targets: ["cert-manager.cert-manager.svc:9402"]

      # argocd_app_info: sync and health status of every Application
      - job_name: argocd
        static_configs:
          - targets:
              - "argocd-metrics.argocd.svc:8082"
              - "argocd-server-metrics.argocd.svc:8083"

      # Kubelet metrics (PVC usage: kubelet_volume_stats_*), reached through the
      # API server proxy: on Talos the kubelet port is not meant to be scraped
      # directly from pods.
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      # "Client-side" checks: HTTP 2xx + TLS certificate actually served by
      # Traefik. *.DOMAIN resolves to Traefik through the CoreDNS custom zone.
      - job_name: blackbox-https
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - "https://argocd.${DOMAIN}"
              - "https://pihole.${DOMAIN}/admin/"
              - "https://jellyfin.${DOMAIN}/health"
        relabel_configs:
          # the target URL becomes the ?target= parameter ...
          - source_labels: [__address__]
            target_label: __param_target
          # ... and stays visible as the "instance" label
          - source_labels: [__param_target]
            target_label: instance
          # the actual scrape goes to the blackbox exporter
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115

  rules.yml: |
    groups:
      - name: meta
        rules:
          # Always firing: routed to healthchecks.io as a dead man's switch.
          # If the pings stop, the monitoring chain (or the whole node) is down.
          - alert: Watchdog
            expr: vector(1)
            labels:
              severity: none
            annotations:
              summary: "Alerting pipeline is alive"

          - alert: TargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Scrape target {{ $labels.job }} / {{ $labels.instance }} is down"

      - name: workloads
        rules:
          - alert: PodCrashLooping
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in CrashLoopBackOff"

          - alert: PodRestartingOften
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | humanize }} times in the last hour"

          - alert: ImagePullFailing
            expr: kube_pod_container_status_waiting_reason{reason=~"ErrImagePull|ImagePullBackOff"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image ({{ $labels.reason }})"

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="false"} == 1 unless on(namespace, pod) kube_pod_status_phase{phase="Succeeded"} == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} is not ready since 15 minutes"

          - alert: DeploymentReplicasMismatch
            expr: kube_deployment_status_replicas_available != kube_deployment_spec_replicas
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} available replicas, not the desired count"

      - name: certificates
        rules:
          - alert: CertExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }} (cert-manager should have renewed it)"

          - alert: CertNotReady
            expr: certmanager_certificate_ready_status{condition="True"} == 0
            for: 30m
            labels:
              severity: critical
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready (issuance/renewal failing)"

      - name: probes
        rules:
          - alert: ProbeFailed
            expr: probe_success == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.instance }} is not answering with HTTP 2xx"

          - alert: ProbeCertExpiring
            expr: probe_ssl_earliest_cert_expiry - time() < 14 * 86400
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "TLS certificate served by {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"

      - name: argocd
        rules:
          - alert: ArgoAppOutOfSync
            expr: argocd_app_info{sync_status!="Synced"} == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "ArgoCD app {{ $labels.name }} is {{ $labels.sync_status }} since 30 minutes"

          - alert: ArgoAppUnhealthy
            expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "ArgoCD app {{ $labels.name }} health is {{ $labels.health_status }}"

      - name: node
        rules:
          # /var = Talos EPHEMERAL partition, /var/mnt/* = UserVolumes (hdd-data-1)
          - alert: NodeDiskAlmostFull
            expr: node_filesystem_avail_bytes{mountpoint=~"/var|/var/mnt/.+"} / node_filesystem_size_bytes{mountpoint=~"/var|/var/mnt/.+"} < 0.10
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Filesystem {{ $labels.mountpoint }} has less than 10% free space"

          - alert: NodeMemoryHigh
            expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} has less than 10% memory available"

          - alert: PVCAlmostFull
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.10
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 10% free space"
