apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # node-exporter needs hostNetwork, hostPID and hostPath mounts of the node's
    # root filesystem to read real host metrics; Prometheus keeps its TSDB on a
    # Talos UserVolume via hostPath. Both are forbidden by "baseline" and
    # "restricted", so the namespace must opt into "privileged" — same
    # reasoning as the jellyfin and pihole namespaces.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
