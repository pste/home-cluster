apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - 01_namespace.yaml
  - 02_argocd.yaml
  - 03_ingress.yaml

patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  # ArgoCD Notifications → ntfy (sync failed / degraded / unknown)
  - path: 04_patch_notifications-cm.yaml
  - path: 05_patch_notifications-secret.yaml
