# ntfy topic URL used by the "ntfy" notification service (see
# 04_patch_notifications-cm.yaml). The topic name is the only "password" on
# ntfy.sh, so it stays in a Secret and in .env, never in git.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
stringData:
  ntfy-url: ${NTFY_URL}
